<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100;300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Sharp:opsz,wght,FILL,GRAD@30,600,1,10" />
    <script src="http://code.jquery.com/jquery-latest.min.js"></script>
    <script type="text/javascript" src="nameRule.js"></script>
    <script type="text/javascript" src="script.js"></script>
</head>

<body>
    <header>

    </header>
    <aside>

    </aside>


    <section id="css-naming">

        <h2><span class="material-symbols-sharp">
                signature
            </span>
            Class Naming</h2>
        <div class="calculation-box">
            <div class="alert">copyed!</div>

            <div class="name-calculation clb">
                <p><sup>Block</sup><span>블록</span></p>
                <p><sup>Element</sup><span>요소</span></p>
                <p><sup>Modifier</sup><span>수식어</span></p>
                <a href="#" id="copy" class="material-symbols-sharp">
                    content_copy
                </a>
            </div>
        </div>

        <ul class="naming-list clb">
            <li class="block">
                <h3> block</h3>
                <ul>
                    <li class="clb"> <input type="text" placeholder="단독사용 가능"></li>

                </ul>
            </li>
            <li class="element">
                <h3>element</h3>
                <ul>
                    <li class="clb"> <input type="text" placeholder="단독사용 ×"></li>
                    <li class="disabled"><a href="#">사용안함</a></li>

                </ul>
            </li>
            <li class="modifier">
                <h3>modifier</h3>
                <ul>
                    <li class="clb"> <input type="text" placeholder="단독사용 ×"></li>
                    <li class="disabled"><a href="#">사용안함</a></li>

                </ul>
            </li>
        </ul>


        <input type="text" id="calculation-copybox">
    </section>
</body></html>
