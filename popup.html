<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Overlay Image</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg:   #111019; --bg2: #1a1829; --bg3: #232138; --bg4: #2d2a44;
      --line: rgba(255,255,255,0.08); --line2: rgba(255,255,255,0.13);
      --txt:  #edeaf8; --txt2: #a9a3c8; --txt3: #736d96;
      --pur:  #7c6eeb; --pur2: #9b8ef2; --pur3: #cec7fc;
      --purb: #272050; --mint: #52b898; --red: #e06b61; --r: 7px;
    }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      width: 256px; background: var(--bg); color: var(--txt);
      font-size: 12px; -webkit-font-smoothing: antialiased; overflow: hidden;
    }

    /* 헤더 */
    .hd {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 12px; border-bottom: 1px solid var(--line);
    }
    .hd-logo {
      width: 24px; height: 24px; border-radius: 5px; background: var(--purb);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .hd-title { font-size: 12px; font-weight: 600; color: var(--txt); flex: 1; }
    .hd-dot {
      width: 6px; height: 6px; border-radius: 50%; background: var(--bg4);
      transition: background .3s, box-shadow .3s;
    }
    .hd-dot.on { background: var(--mint); box-shadow: 0 0 5px var(--mint); }

    /* 이미지 프리뷰 */
    .img-zone {
      margin: 10px 12px 0;
      height: 110px; border-radius: 7px; overflow: hidden;
      background: var(--bg2); border: 1px solid var(--line);
      display: flex; align-items: center; justify-content: center;
      position: relative; cursor: pointer; transition: border-color .2s;
    }
    .img-zone:hover { border-color: var(--pur); }
    .img-zone.has   { border-style: solid; border-color: var(--line); cursor: default; }
    .img-zone.drag  { border-color: var(--pur) !important; background: var(--bg3); }
    .img-zone.flash { border-color: var(--mint) !important; }
    .img-zone input { position: absolute; inset: 0; opacity: 0; cursor: pointer; z-index: 1; }
    .img-empty { display: flex; flex-direction: column; align-items: center; gap: 5px; pointer-events: none; }
    .img-empty-ico { opacity: .25; }
    .img-empty-lbl { font-size: 10px; color: var(--txt3); }
    .img-prev { width: 100%; height: 100%; object-fit: cover; display: none; }
    .img-prev.on { display: block; }
    .img-footer {
      position: absolute; bottom: 0; left: 0; right: 0;
      display: none; align-items: center; gap: 6px;
      padding: 5px 8px;
      background: rgba(13,11,22,0.82);
      border-top: 1px solid var(--line);
    }
    .img-footer.on { display: flex; }
    .img-name { flex: 1; font-size: 9px; color: var(--txt3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .img-change {
      font-size: 9px; font-weight: 500; color: var(--pur2);
      background: var(--purb); border-radius: 4px; padding: 2px 7px;
      border: 1px solid rgba(124,110,235,.3); cursor: pointer;
      white-space: nowrap; position: relative; z-index: 2;
    }

    /* 바디 */
    .bd { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 8px; }

    /* 행 */
    .row { display: flex; align-items: center; gap: 8px; }
    .row-lbl { font-size: 9px; font-weight: 600; color: var(--txt3); text-transform: uppercase; letter-spacing: .5px; min-width: 42px; }

    /* 슬라이더 */
    input[type=range] {
      -webkit-appearance: none; flex: 1; height: 3px; border-radius: 2px;
      outline: none; cursor: pointer;
      background: linear-gradient(to right, var(--pur) 0%, var(--pur) var(--p,50%), var(--bg4) var(--p,50%), var(--bg4) 100%);
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 13px; height: 13px; border-radius: 50%;
      background: var(--txt); border: 2px solid var(--pur); cursor: pointer;
    }
    .sl-val { font-size: 10px; font-weight: 500; color: var(--pur3); min-width: 28px; text-align: right; font-variant-numeric: tabular-nums; }

    /* 크기 프리셋 */
    .sz-btns { display: flex; gap: 4px; flex: 1; }
    .sz-btn {
      flex: 1; height: 26px; border-radius: 5px;
      background: var(--bg3); border: 1px solid var(--line2);
      color: var(--txt3); font-size: 10px; font-weight: 600;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all .12s;
    }
    .sz-btn:hover { border-color: var(--pur2); color: var(--pur2); }
    .sz-btn.on { background: var(--purb); border-color: var(--pur); color: var(--pur3); }

    /* 정렬 버튼 */
    .al-btns { display: flex; gap: 3px; flex: 1; }
    .al-btn {
      flex: 1; height: 28px; border-radius: 5px;
      background: var(--bg3); border: 1px solid var(--line2);
      color: var(--txt3); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all .12s;
    }
    .al-btn:hover { border-color: var(--pur2); color: var(--pur2); }
    .al-btn.on { background: var(--purb); border-color: var(--pur); color: var(--pur3); }
    .al-btn:disabled { opacity: .3; cursor: not-allowed; pointer-events: none; }

    /* 구분선 */
    .sep { height: 1px; background: var(--line); }

    /* 모드 버튼 */
    .mode-row { display: flex; gap: 4px; }
    .mode-btn {
      flex: 1; padding: 7px 4px; border-radius: 6px;
      background: var(--bg2); border: 1px solid var(--line);
      color: var(--txt3); font-size: 9px; font-weight: 500;
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      cursor: pointer; transition: all .12s;
    }
    .mode-btn:hover { border-color: var(--pur2); color: var(--pur2); }
    .mode-btn.on    { background: var(--purb); border-color: var(--pur); color: var(--pur3); }
    .mode-btn.disabled { opacity: .35; cursor: not-allowed; pointer-events: none; }

    /* 요소 고정 행 */
    .anchor-row {
      display: flex; align-items: center; gap: 8px;
      padding: 5px 0;
    }
    .anchor-row-ico {
      width: 28px; height: 28px; border-radius: 6px;
      background: var(--bg3); border: 1px solid var(--line2);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; color: var(--txt3);
    }
    .anchor-row.on .anchor-row-ico { background: var(--purb); border-color: var(--pur); color: var(--pur3); }
    .anchor-row-label { flex: 1; font-size: 10px; font-weight: 500; color: var(--txt2); }
    .anchor-row-sub   { font-size: 9px; color: var(--txt3); }
    .anchor-row.on .anchor-row-sub { color: var(--pur2); }

    /* 토글 스위치 */
    .tog-wrap {
      position: relative; width: 34px; height: 18px; flex-shrink: 0; cursor: default;
    }
    .tog-wrap input { position: absolute; opacity: 0; width: 0; height: 0; }
    .tog-track {
      position: absolute; inset: 0; border-radius: 9px;
      background: var(--bg4); border: 1px solid var(--line2);
      transition: background .2s, border-color .2s;
    }
    .tog-wrap input:checked ~ .tog-track { background: var(--pur); border-color: var(--pur); }
    .tog-thumb {
      position: absolute; top: 50%; transform: translateY(-50%);
      left: 2px; width: 12px; height: 12px; border-radius: 50%;
      background: rgba(255,255,255,0.35); transition: left .2s, background .2s;
    }
    .tog-wrap input:checked ~ .tog-thumb { left: 18px; background: #fff; }

    /* 경고 문구 */
    .warn-bar {
      margin: 8px 12px 0;
      display: flex; align-items: flex-start; gap: 7px;
      background: rgba(224,107,97,0.1);
      border: 1px solid rgba(224,107,97,0.25);
      border-radius: 6px; padding: 8px 10px;
    }
    .warn-ico { flex-shrink: 0; color: var(--red); margin-top: 1px; }
    .warn-text { font-size: 10px; color: #e8877f; line-height: 1.5; }

    /* 액션 */
    .act-row { display: flex; gap: 5px; }
    .btn-start {
      flex: 1; height: 32px; border-radius: var(--r);
      background: var(--pur); color: #fff;
      font-family: inherit; font-size: 11px; font-weight: 600;
      border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 5px;
      transition: background .12s;
    }
    .btn-start:hover { background: var(--pur2); }
    .btn-start.off { background: var(--bg3); color: var(--txt2); border: 1px solid var(--line2); }
    .btn-start.off:hover { background: var(--bg4); color: var(--txt); }
    .btn-del {
      width: 32px; height: 32px; border-radius: var(--r);
      background: var(--bg3); border: 1px solid var(--line2);
      color: var(--txt3); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all .12s;
    }
    .btn-del:hover { color: var(--red); border-color: var(--red); }

    /* 인라인 경고 */
    .inline-warn {
      display: none; align-items: center; gap: 6px;
      padding: 6px 9px; border-radius: 6px;
      background: rgba(224,107,97,0.1); border: 1px solid rgba(224,107,97,0.25);
      font-size: 10px; color: #e8877f; animation: shake .3s ease;
    }
    .inline-warn.show { display: flex; }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      25%      { transform: translateX(-4px); }
      75%      { transform: translateX(4px); }
    }

    /* 블렌드 커스텀 셀렉트 */
    .blend-select {
      position: relative; flex: 1;
    }
    .blend-trigger {
      width: 100%; height: 26px; border-radius: 5px;
      background: var(--bg3); border: 1px solid var(--line2);
      color: var(--txt2); font-size: 10px; font-weight: 500;
      font-family: inherit;
      display: flex; align-items: center; gap: 6px;
      padding: 0 8px; cursor: pointer;
      transition: border-color .15s, background .15s;
      user-select: none;
    }
    .blend-trigger:hover { border-color: var(--pur2); background: var(--bg4); }
    .blend-trigger.open  { border-color: var(--pur); background: var(--bg4); }
    .blend-trigger-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .blend-trigger-label { flex: 1; text-align: left; }
    .blend-trigger-arrow {
      color: var(--txt3); transition: transform .15s; flex-shrink: 0;
    }
    .blend-trigger.open .blend-trigger-arrow { transform: rotate(180deg); }

    .blend-dropdown {
      display: none;
      position: absolute;
      top: calc(100% + 4px); left: 0; right: 0;
      background: rgba(13,11,22,0.98);
      border: 1px solid rgba(124,110,235,0.35);
      border-radius: 7px;
      overflow: hidden;
      z-index: 9999;
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
    }
    .blend-dropdown.open { display: block; }

    .blend-option {
      display: flex; align-items: center; gap: 8px;
      padding: 7px 10px; cursor: pointer;
      transition: background .1s;
      font-size: 10px; color: var(--txt2); font-weight: 500;
    }
    .blend-option:hover { background: rgba(124,110,235,0.15); color: var(--txt); }
    .blend-option.on    { background: rgba(124,110,235,0.12); color: var(--pur3); }
    .blend-option-dot   { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .blend-option-name  { flex: 1; }
    .blend-option-desc  { font-size: 9px; color: var(--txt3); }
    .blend-option-check {
      opacity: 0; color: var(--pur); font-size: 10px;
    }
    .blend-option.on .blend-option-check { opacity: 1; }
  </style>
</head>
<body>

<!-- 헤더 -->
<div class="hd">
  <div class="hd-logo">
    <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
      <rect x="1" y="1" width="4.5" height="4.5" rx="1" fill="#7c6eeb" opacity=".9"/>
      <rect x="7" y="1" width="4.5" height="4.5" rx="1" fill="#7c6eeb" opacity=".4"/>
      <rect x="1" y="7" width="4.5" height="4.5" rx="1" fill="#7c6eeb" opacity=".4"/>
      <rect x="7" y="7" width="4.5" height="4.5" rx="1" fill="#7c6eeb" opacity=".15"/>
    </svg>
  </div>
  <span class="hd-title">Overlay Image</span>
  <div class="hd-dot" id="statusDot"></div>
</div>

<!-- 경고: 사용 불가 페이지 -->
<div class="warn-bar" id="warnBar" style="display:none;">
  <div class="warn-ico">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
      <path d="M7 1.5L13 12.5H1L7 1.5z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
      <path d="M7 5.5v3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
      <circle cx="7" cy="10" r=".7" fill="currentColor"/>
    </svg>
  </div>
  <div class="warn-text">이 페이지에서는 사용할 수 없어요.<br>일반 웹페이지에서 열어주세요.</div>
</div>

<!-- 이미지 업로드 -->
<div class="img-zone" id="uploadZone">
  <input type="file" id="fileInput" accept="image/*" />
  <div class="img-empty" id="uploadEmpty">
    <div class="img-empty-ico">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#edeaf8" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="2" width="20" height="20" rx="4"/>
        <circle cx="8" cy="8" r="2.5"/>
        <polyline points="22 15 16 9 4 22"/>
      </svg>
    </div>
    <div class="img-empty-lbl">클릭 · 드래그 · Ctrl+V</div>
  </div>
  <img class="img-prev" id="previewImg" alt="" />
  <div class="img-footer" id="imgFooter">
    <span class="img-name" id="previewName"></span>
    <label class="img-change">
      변경
      <input type="file" accept="image/*" id="fileChange" style="display:none"/>
    </label>
  </div>
</div>

<div class="bd">

  <!-- 불투명도 -->
  <div class="row">
    <span class="row-lbl">불투명도</span>
    <input type="range" id="opSlider" min="0" max="100" value="50" step="1" />
    <span class="sl-val" id="opVal">50%</span>
  </div>

  <!-- 크기 -->
  <div class="row">
    <span class="row-lbl">크기</span>
    <div class="sz-btns">
      <button class="sz-btn" id="sz05" data-scale="50">×0.5</button>
      <button class="sz-btn on" id="sz10" data-scale="100">×1</button>
      <button class="sz-btn" id="sz20" data-scale="200">×2</button>
    </div>
  </div>

  <!-- 블렌드 모드 커스텀 셀렉트 -->
  <div class="row">
    <span class="row-lbl">블렌드</span>
    <div class="blend-select" id="blendSelect">
      <!-- 트리거 -->
      <div class="blend-trigger" id="blendTrigger">
        <span class="blend-trigger-dot" id="blendDot" style="background:#9b94b8"></span>
        <span class="blend-trigger-label" id="blendLabel">Normal</span>
        <svg class="blend-trigger-arrow" width="10" height="10" viewBox="0 0 10 10" fill="none">
          <path d="M2 3.5l3 3 3-3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <!-- 드롭다운 -->
      <div class="blend-dropdown" id="blendDropdown">
        <div class="blend-option on" data-blend="normal" data-dot="#9b94b8" data-name="Normal">
          <span class="blend-option-dot" style="background:#9b94b8"></span>
          <span class="blend-option-name">Normal</span>
          <span class="blend-option-desc">기본</span>
          <span class="blend-option-check">✓</span>
        </div>
        <div class="blend-option" data-blend="difference" data-dot="#e06b61" data-name="Difference">
          <span class="blend-option-dot" style="background:#e06b61"></span>
          <span class="blend-option-name">Difference</span>
          <span class="blend-option-desc">차이 강조</span>
          <span class="blend-option-check">✓</span>
        </div>
        <div class="blend-option" data-blend="multiply" data-dot="#c4a55a" data-name="Multiply">
          <span class="blend-option-dot" style="background:#c4a55a"></span>
          <span class="blend-option-name">Multiply</span>
          <span class="blend-option-desc">어둡게 합성</span>
          <span class="blend-option-check">✓</span>
        </div>
        <div class="blend-option" data-blend="screen" data-dot="#5a9be0" data-name="Screen">
          <span class="blend-option-dot" style="background:#5a9be0"></span>
          <span class="blend-option-name">Screen</span>
          <span class="blend-option-desc">밝게 합성</span>
          <span class="blend-option-check">✓</span>
        </div>
      </div>
    </div>
  </div>

  <!-- 정렬 -->
  <div class="row">
    <span class="row-lbl">정렬</span>
    <div class="al-btns">
      <button class="al-btn" data-snap="top" title="상단">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M1 1.5h12" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><rect x="4" y="3.5" width="6" height="8" rx="1" stroke="currentColor" stroke-width="1.2"/></svg>
      </button>
      <button class="al-btn" data-snap="middle" title="수직 중앙">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M1 7h12" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" opacity=".4"/><rect x="4" y="2.5" width="6" height="9" rx="1" stroke="currentColor" stroke-width="1.2"/></svg>
      </button>
      <button class="al-btn" data-snap="bottom" title="하단">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M1 12.5h12" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><rect x="4" y="2.5" width="6" height="8" rx="1" stroke="currentColor" stroke-width="1.2"/></svg>
      </button>
      <button class="al-btn" data-snap="left" title="좌측">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M1.5 1v12" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><rect x="3.5" y="4" width="8" height="6" rx="1" stroke="currentColor" stroke-width="1.2"/></svg>
      </button>
      <button class="al-btn" data-snap="right" title="우측">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M12.5 1v12" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><rect x="2.5" y="4" width="8" height="6" rx="1" stroke="currentColor" stroke-width="1.2"/></svg>
      </button>
    </div>
  </div>

  <div class="sep"></div>


  <!-- 모드: 포인터통과 / 숨기기 -->
  <div class="mode-row">
    <button class="mode-btn" id="modePtr">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <path d="M4 4l4.5 7.5 1.1-2.8 3.4-1.7L4 4z" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M2 14l3.5-3.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" opacity=".4"/>
      </svg>
      <span>포인터통과</span>
    </button>
    <button class="mode-btn" id="modeHide">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <path d="M2 2l12 12" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
        <path d="M5.5 5.8C3.8 6.8 2.7 7.7 2 8c1.5 2.5 3.5 4 6 4 1 0 2-.3 2.7-.8" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
        <path d="M7.5 4.1C7.7 4 7.8 4 8 4c2.5 0 4.5 1.5 6 4-.5.9-1.2 1.7-2 2.3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
      </svg>
      <span>숨기기</span>
    </button>
  </div>

  <div class="sep"></div>

  <!-- 인라인 경고 -->
  <div class="inline-warn" id="inlineWarn">
    <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M6 1.5L11.5 11H.5L6 1.5z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/><path d="M6 5v2.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/><circle cx="6" cy="9" r=".6" fill="currentColor"/></svg>
    이미지를 먼저 업로드해주세요.
  </div>

  <!-- 액션 -->
  <div class="act-row">
    <button class="btn-start" id="toggleBtn">
      <svg width="11" height="11" viewBox="0 0 11 11" fill="none"><circle cx="5.5" cy="5.5" r="4.5" stroke="currentColor" stroke-width="1.2"/><path d="M4 5.5h3M5.5 4v3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
      시작
    </button>
    <button class="btn-del" id="removeBtn">
